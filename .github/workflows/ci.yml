name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Self-hosted on Zach's gaming PC (WSL2 Ubuntu, runners zach-pc-sdk-*).
    # This repo is public: pull requests from forks stay on a GitHub-hosted
    # runner so untrusted code never runs on the self-hosted machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","zach-pc"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24, 26]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
